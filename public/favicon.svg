<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bg)" stroke="rgba(148,163,184,0.35)" stroke-width="1.5" />
  <!-- Left: Transformer KV stack — growing notebook pages -->
  <g fill="#22d3ee">
    <rect x="7" y="27" width="12" height="4.5" rx="2.2" />
    <rect x="7" y="21" width="12" height="4.5" rx="2.2" />
    <rect x="7" y="15" width="12" height="4.5" rx="2.2" opacity="0.6" />
  </g>
  <!-- Right: BDH fixed synaptic unit -->
  <rect x="25" y="15" width="16" height="16" rx="4.5" fill="none" stroke="#a78bfa" stroke-width="2.5" />
  <circle cx="33" cy="23" r="3.4" fill="#f0abfc" />
