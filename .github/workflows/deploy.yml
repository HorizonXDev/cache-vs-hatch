name: Deploy to GitHub Pages

on:
  # Runs on every push to master
  push:
    branches: ['master']
  # Lets you trigger a deploy manually from the Actions tab
  workflow_dispatch:

# Grant the workflow permission to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time: cancel an in-flight run when a new push arrives
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 1) Build the site and upload dist/ as a Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2) Publish the artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
